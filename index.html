<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="InSpaces is coming soon.">
  <meta name="theme-color" content="#f7f7f5">
  <title>InSpaces — Coming soon</title>
  <link rel="icon" href="./spaces-mark.svg" type="image/svg+xml">
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #252826;
      background: #f7f7f5;
    }

    body {
      display: grid;
      min-block-size: 100svh;
      margin: 0;
      place-items: center;
    }

    main {
      padding: 2rem 1.5rem;
      text-align: center;
    }

    .mark {
      display: block;
      inline-size: clamp(3.5rem, 11vw, 5rem);
      block-size: auto;
      margin: 0 auto 1.25rem;
    }

    h1 {
      margin: 0;
      color: #616560;
      font-size: 1.125rem;
      font-weight: 500;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main>
    <img class="mark" src="./spaces-mark.svg" width="100" height="100" alt="InSpaces">
    <h1>Coming soon</h1>
  </main>
</body>
</html>
